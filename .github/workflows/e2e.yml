name: E2E Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Start MySQL using Docker Compose
        run: |
          cd docker
          docker compose up -d

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."
          for i in {1..10}; do
            nc -z localhost 3306 && break
            echo "MySQL not ready, retrying..."
            sleep 5
          done

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Start Spring Boot (background)
        run: nohup ./gradlew bootRun --args="--spring.profiles.active=e2e" &

      - name: Wait for Spring Boot Server
        run: |
          echo "Waiting for SpringBoot service..."
          sleep 25

      - name: Run E2E Tests
        run: ./gradlew test -Penvironment=e2e --stacktrace
