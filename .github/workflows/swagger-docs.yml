name: Deploy Swagger Docs

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  deploy-swagger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Build Spring Boot App (no test)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Run Docker Services
        run: |
          cd docker
          docker-compose up -d

      - name: Generate OpenAPI JSON
        run: |
          mkdir -p docs
          sleep 15
          curl -o docs/openapi.json http://localhost:8080/v3/api-docs

      - name: Download Swagger UI and Apply Config
        run: |
          wget https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -O swagger.zip
          unzip swagger.zip
          mv swagger-ui-master/dist/* docs/
          rm -rf swagger-ui-master swagger.zip
          sed -i 's|https://petstore.swagger.io/v2/swagger.json|./openapi.json|g' docs/swagger-initializer.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
